  demo1:
    image: ghcr.io/linuxserver/ffmpeg:version-6.1-cli
    container_name: demo1
    network_mode: host
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ffmpeg -rtsp_transport tcp -fflags +genpts -rtbufsize 256M
        -use_wallclock_as_timestamps 1
        -i rtsp://192.168.0.171:554/live/0/MAIN
        -vf "scale=1280:720"
        -c:v libx264 -preset veryfast -tune zerolatency -profile:v baseline
        -g 50 -keyint_min 50
        -c:a aac -ar 44100 -b:a 128k
        -f flv rtmp://49.50.74.61:6002/live/demo1

  demo2:
    image: ghcr.io/linuxserver/ffmpeg:version-6.1-cli
    container_name: demo2
    network_mode: host
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ffmpeg -rtsp_transport tcp -fflags +genpts -rtbufsize 256M
        -use_wallclock_as_timestamps 1
        -i rtsp://192.168.0.185:554/live/0/MAIN
        -vf "scale=1280:720"
        -c:v libx264 -preset veryfast -tune zerolatency -profile:v baseline
        -g 50 -keyint_min 50
        -c:a aac -ar 44100 -b:a 128k
        -f flv rtmp://49.50.74.61:6002/live/demo2