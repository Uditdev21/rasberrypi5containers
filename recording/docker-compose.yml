services:
  stream7:
    image: camera-recorder:latest
    container_name: stream7
    restart: always
    environment:
      - STREAM_NAME=stream7
      - TZ=Asia/Kolkata
    volumes:
      - ./recording/stream7.py:/app/stream.py:ro
      - ./chunks:/app/chunks

